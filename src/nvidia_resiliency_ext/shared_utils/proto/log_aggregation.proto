syntax = "proto3";

package nvidia_resiliency_ext.fault_tolerance;

import "nvidia_resiliency_ext/shared_utils/proto/nvrx_interface.proto";

// Service for aggregating data records from multiple nodes: log chunks into a single file,
// and the launchers' cycle end reports
service DataRecordAggregationService {
  // Stream data records from clients to server
  rpc StreamDataRecords(stream DataRecord) returns (StreamResponse);

  // Health check
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// One record of a client's stream: a log chunk, or a launcher's cycle end report
message DataRecord {
  oneof record {
    LogChunk log_chunk = 1;
    NodeCycleEndReport node_cycle_end_report = 2;
  }
}

// Log chunk sent from client to server
message LogChunk {
  // Node identifier (e.g., node rank, hostname, or UUID for future flexibility)
  string node_id = 1;
  
  // Log data (should contain complete lines ending with \n)
  bytes data = 2;
  
  // Target log file path (for multi-file support)
  string file_path = 3;
}

// Response from server after receiving log stream
message StreamResponse {
  string status = 1;
  int64 bytes_received = 2;
}

// Health check request
message HealthRequest {
}

// Health check response
message HealthResponse {
  bool healthy = 1;
  int32 connected_clients = 2;
}
