syntax = "proto3";

package nvidia_resiliency_ext.fault_tolerance;

// Publishes cycle records towards the CycleAnalyzer. Best effort.
service CycleInfoService {
  // Sent by the store host once per cycle, when it closes the rendezvous round.
  rpc PublishCycleInfo(CycleInfo) returns (PublishReply);

  // Sent by the store host once per cycle, when it the cycle ends.
  rpc UpdateCycleInfo(CycleInfo) returns (PublishReply);

  // Sent by each launcher, when the cycle ends for it.
  rpc PublishNodeCycleEndReport(NodeCycleEndReport) returns (PublishReply);
}

// CycleInfo describes a single NVRx cycle for a Slurm job.
// Serialized as JSON and stored in cycle_info.<job_id>.<attempt>.<cycleXX>
// under <base_dir>/nvrx/. The workload reads the current cycle via
// cycle_info.<job_id>.current symlink (see NVRX_CYCLE_INFO_DIR env).
message CycleInfo {
  // Slurm job id (or Slurm array job id)
  string job_id = 1;

  // Slurm attempt index (SLURM_RESTART_COUNT)
  uint32 attempt_index = 2;

  // Cycle number (0-based)
  uint32 cycle_number = 3;

  // Cycle start time, ISO 8601 UTC (e.g. "2025-02-05T14:30:00.123456Z").
  // Python: datetime.fromisoformat(s.replace("Z", "+00:00"))
  string cycle_start_time = 4;

  // Cycle end time, ISO 8601 UTC. Updated when the cycle ends; file is
  // written again (atomically) to persist this.
  string cycle_end_time = 5;

  // Path to the cycle log file for this cycle
  string cycle_log_file = 6;

  // Active nodes used in this cycle, in SLURM node range format (e.g. "node[001-004,007]")
  string active_nodes = 7;

  // Standby (hot spare) nodes in this cycle, in SLURM node range format. Empty if none.
  string standby_nodes = 8;

  // Monotonic generation for compare-and-swap: 0 on create, increment on every
  // write. A CAS update only succeeds when the stored generation equals the one
  // in the request; after a successful write, the new generation is (previous + 1).
  uint64 generation = 9;

  // Group ranks of active nodes, aligned with active_nodes (same sort order).
  // SLURM-range-compressed, e.g. "0-3,6".
  string active_ranks = 10;

  // Moved into NVRxCycleOutcome. TODO: why do we need this here?
  reserved 11, 12, 13;

  // How the cycle ended for the job, concluded by the CycleAnalyzer from all launchers'
  // end reports. Unset until the cycle's end is written. The time it ended is
  // cycle_end_time.
  JobCycleEndReport end_report = 14;

  // Timestamp in the local node where the CycleInfo object was created, in milliseconds
  // since the Unix epoch (UTC). Used for updates
  uint64 timestamp = 15;
}

// How a cycle ended for the job. Each launcher reports how the cycle ended for it; the
// CycleAnalyzer writes this once every active launcher reported, or after a grace period
// without waiting for absent launchers.
message JobCycleEndReport {
  // "completed", "rank_failure" (a worker failed or was stopped by its rank monitor; the
  // launcher outcomes tell which), "terminated" (a no-restart decision), or "unknown"
  EndReason end_reason = 1;

  // When the cycle ended, ISO 8601 UTC: when its end was first observed, or when the
  // last launcher completed. Also written to NVRxCycleInfo.cycle_end_time.
  string ended_timestamp = 2;

  // Nodes whose launchers observed the end first (several when they tie)
  repeated string first_detected_nodes = 3;

  // End reports of launchers
  repeated NodeCycleEndReport launcher_end_reports = 4;
}

// How a cycle ended on one launcher, as that launcher observed it.
message NodeCycleEndReport {
  // Slurm job id (or Slurm array job id)
  string job_id = 1;

  // Slurm attempt index (SLURM_RESTART_COUNT)
  uint32 attempt_index = 2;

  // Cycle number (0-based)
  uint32 cycle_number = 3;

  // Launcher host name
  string node_name = 4;

  // "failed" (a local worker exited or was stopped by its rank monitor),
  // "peer_restart", "terminated" (a no-restart decision), or "completed"
  EndReason end_reason = 5;

  // When the launcher observed the end, in milliseconds since the Unix epoch (UTC)
  uint64 detected_timestamp = 6;

  // Details about the node's ranks' failures - TODO: check if string is the right type here
  string exit_details = 7;
}

enum EndReason {
  CycleEndReasonUnspecified = 0;
  CycleEndReasonWorkerCompleted = 1;
  CycleEndReasonWorkerFailed = 2;
  CycleEndReasonWorkerTerminatedDueToPeer = 3;
  CycleEndReasonWorkerTerminatedByRankMonitor = 4;
  CycleEndReasonWorkerTerminatedByAttribution = 5;
}

// Reply to the CycleInfoService RPCs: delivery is acknowledged, nothing else.
message PublishReply {}
