syntax = "proto3";

package nvidia_resiliency_ext.fault_tolerance;

// NVRxCycleInfo describes a single NVRx cycle for a Slurm job.
// Serialized as JSON and stored in cycle_info.<job_id>.<attempt>.<cycleXX>
// under <base_dir>/nvrx/. The workload reads the current cycle via
// cycle_info.<job_id>.current symlink (see NVRX_CYCLE_INFO_DIR env).
message NVRxCycleInfo {
  // Slurm job id (or Slurm array job id)
  string job_id = 1;

  // Slurm attempt index (SLURM_RESTART_COUNT)
  uint32 attempt_index = 2;

  // Cycle number (0-based)
  uint32 cycle_number = 3;

  // Cycle start time, ISO 8601 UTC (e.g. "2025-02-05T14:30:00.123456Z").
  // Python: datetime.fromisoformat(s.replace("Z", "+00:00"))
  string cycle_start_time = 4;

  // Cycle end time, ISO 8601 UTC. Updated when the cycle ends; file is
  // written again (atomically) to persist this.
  string cycle_end_time = 5;

  // Path to the cycle log file for this cycle
  string cycle_log_file = 6;

  // Active nodes used in this cycle, in SLURM node range format (e.g. "node[001-004,007]")
  string active_nodes = 7;

  // Standby (hot spare) nodes in this cycle, in SLURM node range format. Empty if none.
  string standby_nodes = 8;

  // Monotonic generation for compare-and-swap: 0 on create, increment on every
  // write. A CAS update only succeeds when the stored generation equals the one
  // in the request; after a successful write, the new generation is (previous + 1).
  uint64 generation = 9;

  // Group ranks of active nodes, aligned with active_nodes (same sort order).
  // SLURM-range-compressed, e.g. "0-3,6".
  string active_ranks = 10;

  // Cycle outcomes, written when the next rendezvous round closes and only with
  // --ft-cycle-info-outcomes. Each active launcher reports how the cycle ended for it
  // before rejoining; the store host collects the reports without waiting for absent
  // launchers.

  // Reports of launchers that observed the end themselves (failed or terminated).
  // Launchers that only followed a peer's restart are counted, not listed.
  repeated NVRxLauncherOutcome launcher_outcomes = 11;

  // Active launchers of this cycle (0 if the store host did not see the cycle start),
  // and how many of them reported. Fewer reports than expected means some launchers
  // did not rejoin (e.g. their node was lost).
  uint32 outcome_launchers_expected = 12;
  uint32 outcome_launchers_reported = 13;
}

// How a cycle ended on one launcher, as that launcher observed it.
message NVRxLauncherOutcome {
  // Launcher host name
  string node = 1;

  // "failed" (a local worker exited or was stopped by its rank monitor),
  // "peer_restart", "terminated" (a no-restart decision), or "completed"
  string end = 2;

  // When the launcher observed the end, ISO 8601 UTC
  string detected_at = 3;

  repeated NVRxRankOutcome ranks = 4;
}

// How one worker of a launcher ended.
message NVRxRankOutcome {
  uint32 global_rank = 1;
  uint32 local_rank = 2;
  uint32 pid = 3;

  // "completed", "failed" (exited on its own), "stopped_by_launcher", or
  // "stopped_by_rank_monitor" (its rank monitor detected a timeout first)
  string end = 4;

  // Worker exit code when it exited; negative for a signal
  optional int32 exitcode = 5;

  // For stopped_by_rank_monitor: "heartbeat", "section", or "out_of_section",
  // and the workload sections that timed out
  string timeout_kind = 6;
  repeated string timeout_sections = 7;
}
